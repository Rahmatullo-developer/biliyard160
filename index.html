<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Biliyard160</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: sticky-free single column app. Top: club header + totals. Then tabs: Stollar (3 table cards), Mahsulotlar, Hisobot. */
:root{
  --bg:#edf1ee; --surface:#ffffff; --surface-2:#f4f7f5; --fg:#13231a; --muted:#5a6c62; --line:#d6dfd9;
  --felt:#0e6a49; --felt-ink:#ffffff; --felt-soft:#d9efe5;
  --gold:#a8730d; --gold-soft:#f7ecd2;
  --red:#c23b27; --red-ink:#ffffff; --red-soft:#fbe3de;
  --shadow:0 1px 2px rgba(10,30,20,.06),0 8px 24px rgba(10,30,20,.07);
  --ball-1:#f2c230; --ball-2:#2457c5; --ball-3:#d6342a;
  --f-display:'Unbounded','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#09140f; --surface:#112119; --surface-2:#173026; --fg:#e7f0ea; --muted:#8ea599; --line:#24392f;
    --felt:#34c98b; --felt-ink:#04170e; --felt-soft:#12382a;
    --gold:#f0b84a; --gold-soft:#33290f;
    --red:#ff7a63; --red-ink:#2a0905; --red-soft:#3a1712;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#09140f; --surface:#112119; --surface-2:#173026; --fg:#e7f0ea; --muted:#8ea599; --line:#24392f;
  --felt:#34c98b; --felt-ink:#04170e; --felt-soft:#12382a;
  --gold:#f0b84a; --gold-soft:#33290f;
  --red:#ff7a63; --red-ink:#2a0905; --red-soft:#3a1712;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg); font-family:var(--f-body); font-size:15px; line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px 48px; transition:background .35s ease,color .35s ease;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--felt);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:46px;height:46px;border-radius:50%;background:#101612;display:grid;place-items:center;flex:none;box-shadow:inset -5px -6px 10px rgba(0,0,0,.5),inset 4px 4px 8px rgba(255,255,255,.12);animation:float 5s ease-in-out infinite}
.logo i{width:25px;height:25px;border-radius:50%;background:#f3f3ee;display:grid;place-items:center;font:700 9px/1 var(--f-display);color:#101612;font-style:normal}
.brand h1{font:700 22px/1.1 var(--f-display);margin:0;letter-spacing:-.02em}
.brand small{display:block;color:var(--muted);font-size:12.5px;margin-top:3px}
.tools{display:flex;align-items:center;gap:10px}
.clock{font-size:20px;font-weight:700;color:var(--muted)}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;transition:transform .25s ease,background .25s ease}
.iconbtn:hover{transform:rotate(18deg) scale(1.06)}
.iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.iconbtn .sun{display:none}
:root[data-theme="dark"] .iconbtn .sun{display:block}
:root[data-theme="dark"] .iconbtn .moon{display:none}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .iconbtn .sun{display:block}
  :root:not([data-theme="light"]) .iconbtn .moon{display:none}
}
.notice{background:var(--red-soft);color:var(--red);border:1px solid var(--red);border-radius:10px;padding:10px 14px;font-weight:600}

/* totals strip */
.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.tot{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.tot span{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tot b{display:block;font-size:26px;margin-top:4px;font-weight:700}
.tot b em{font:600 13px var(--f-body);color:var(--muted);font-style:normal;letter-spacing:0;margin-left:4px}
.tot.main{background:var(--felt);border-color:var(--felt);color:var(--felt-ink)}
.tot.main span{color:inherit;opacity:.8}
.tot.main b em{color:inherit;opacity:.8}

/* tabs */
.tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px;width:max-content;max-width:100%;overflow-x:auto}
.tab{border:0;background:transparent;padding:9px 18px;border-radius:999px;font-weight:700;color:var(--muted);white-space:nowrap;transition:background .2s,color .2s}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{background:var(--felt);color:var(--felt-ink)}
.view{animation:fadeup .35s ease both}

/* table cards */
.tables{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:var(--shadow);animation:fadeup .5s ease backwards;transition:border-color .3s,transform .25s}
.card:nth-child(2){animation-delay:.07s}.card:nth-child(3){animation-delay:.14s}
.card:hover{transform:translateY(-2px)}
.card.on{border-color:var(--felt);animation:fadeup .5s ease backwards,glow 2.6s ease-in-out infinite}
.chead{display:flex;align-items:center;gap:12px}
.ball{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;position:relative;box-shadow:inset -5px -6px 9px rgba(0,0,0,.35),inset 4px 4px 7px rgba(255,255,255,.35)}
.ball i{width:21px;height:21px;border-radius:50%;background:#f6f6f1;color:#111;font:700 12px/1 var(--f-display);font-style:normal;display:grid;place-items:center}
.b1{background:var(--ball-1)}.b2{background:var(--ball-2)}.b3{background:var(--ball-3)}
.on .ball{animation:roll 3.2s linear infinite}
.chead h2{margin:0;font:700 19px/1.1 var(--f-display);letter-spacing:-.01em;flex:1;min-width:0}
.pill{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:5px 11px;border-radius:999px;background:var(--surface-2);color:var(--muted);display:flex;align-items:center;gap:7px}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.on .pill{background:var(--felt-soft);color:var(--felt)}
.on .pill::before{background:var(--felt);animation:blink 1.2s ease-in-out infinite}
.clockface{background:var(--surface-2);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.timer{font-size:clamp(34px,9vw,44px);font-weight:700;line-height:1.1}
.timer .sep{display:inline-block;animation:blink 1s steps(2,start) infinite}
.idle .timer .sep{animation:none}
.sumline{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sumline .lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.bigsum{font-size:24px;font-weight:700;color:var(--gold)}
.bigsum em{font:600 13px var(--f-body);color:var(--muted);margin-left:4px;font-style:normal}
.mini{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:14px}
.mini b{color:var(--fg)}
.total{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-top:1px dashed var(--line);padding-top:12px}
.total b{font-size:22px}
.total .lbl{font-weight:800}
.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:800;font-size:16px;transition:transform .15s,filter .2s,background .2s;width:100%}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:scale(.97)}
.btn.start{background:var(--felt);color:var(--felt-ink)}
.btn.stop{background:var(--red);color:var(--red-ink)}
.btn.stop.sure{animation:shake .4s ease}
.btn.ghost{background:var(--surface-2);color:var(--fg);width:auto;padding:10px 16px;font-size:14px}
.psec{display:flex;flex-direction:column;gap:8px}
.psec h3{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:600;display:flex;gap:6px;align-items:baseline;transition:background .2s,border-color .2s,transform .15s}
.chip small{color:var(--muted);font-weight:600}
.chip:hover:not(:disabled){border-color:var(--felt);background:var(--felt-soft)}
.chip:active:not(:disabled){transform:scale(.94)}
.chip:disabled{opacity:.45;cursor:not-allowed}
.hint{color:var(--muted);font-size:13px;margin:0}
.lines{display:flex;flex-direction:column;gap:6px}
.line{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;font-size:14px;animation:fadeup .25s ease both}
.line .nm{min-width:0;overflow-wrap:anywhere}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);font-weight:800;line-height:1;display:grid;place-items:center}
.qty button:hover{border-color:var(--felt)}
.qty span{min-width:18px;text-align:center;font-weight:700}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.panel h2{margin:0;font:700 17px/1.2 var(--f-display)}
.panel p{margin:0;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
input[type=text],input[type=number]{font:inherit;color:var(--fg);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-width:0}
.formrow{display:grid;grid-template-columns:1fr 150px auto;gap:10px;align-items:end}
.formrow .btn{width:auto}
.plist{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:1fr 130px auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow .nm{font-weight:700;min-width:0;overflow-wrap:anywhere}
.linkbtn{border:0;background:transparent;color:var(--muted);font-weight:700;padding:8px 10px;border-radius:8px}
.linkbtn:hover{color:var(--red);background:var(--red-soft)}
.linkbtn.sure{color:var(--red-ink);background:var(--red)}

/* reports */
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface-2);border-radius:12px;padding:12px 14px;min-width:0}
.stat span{display:block;font-size:12px;color:var(--muted);font-weight:700}
.stat b{display:block;font-size:18px;margin-top:2px}
.stat.big{grid-column:1/-1;background:var(--felt);color:var(--felt-ink)}
.stat.big span{color:inherit;opacity:.8}
.stat.big b{font-size:28px}
.rows{display:flex;flex-direction:column}
.rrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.rrow:first-child{border-top:0}
.rrow .ball{width:28px;height:28px;box-shadow:inset -3px -4px 6px rgba(0,0,0,.35),inset 2px 2px 4px rgba(255,255,255,.35)}
.rrow .ball i{width:14px;height:14px;font-size:8px}
.rrow small{color:var(--muted);display:block}
.bars{display:flex;align-items:flex-end;gap:3px;height:150px;padding-top:8px;border-bottom:1px solid var(--line)}
.bar{flex:1;min-width:0;border-radius:4px 4px 0 0;background:var(--felt-soft);transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.8,.2,1) backwards;position:relative}
.bar.has{background:var(--felt)}
.bar.today{background:var(--gold)}
.baxis{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:6px}
.empty{color:var(--muted);padding:14px 0;text-align:center}
.scroll{overflow-x:auto}

/* receipt */
.overlay{position:fixed;inset:0;background:rgba(5,12,8,.6);display:grid;place-items:center;padding:16px;z-index:50;animation:fade .2s ease both}
.receipt{background:var(--surface);color:var(--fg);border-radius:20px;padding:22px;width:min(100%,400px);max-height:calc(100% - 16px);overflow-y:auto;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.4);animation:pop .3s cubic-bezier(.2,1.2,.3,1) both}
.receipt h2{margin:0;font:700 20px var(--f-display)}
.receipt .k{display:flex;justify-content:space-between;gap:12px}
.receipt .k span{color:var(--muted)}
.receipt .k b{text-align:right}
.receipt hr{border:0;border-top:1px dashed var(--line);width:100%;margin:2px 0}
.receipt .gt{font-size:28px;font-weight:700;color:var(--gold)}

@keyframes fadeup{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.88) translateY(10px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:.25}}
@keyframes float{50%{transform:translateY(-3px)}}
@keyframes roll{to{transform:rotate(360deg)}}
@keyframes glow{50%{box-shadow:0 0 0 4px var(--felt-soft),var(--shadow)}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (max-width:520px){
  .formrow{grid-template-columns:1fr 1fr}
  .formrow .btn{grid-column:1/-1;width:100%}
  .prow{grid-template-columns:1fr auto}
  .prow .price{grid-column:1}
  .clock{display:none}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
<style>html{color-scheme:light}body{margin:0}</style>
</head>
<body>

<div class="wrap" id="app">
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true"><i>160</i></div>
      <div><h1>Biliyard160</h1><small id="dateline"></small></div>
    </div>
    <div class="tools">
      <span class="clock num" id="clock">--:--</span>
      <button class="iconbtn" id="themebtn" type="button" aria-label="Rejimni almashtirish (kunduzgi / tungi)">
        <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <div id="notice"></div>
  <section class="totals" id="totals" aria-label="Umumiy hisob"></section>

  <nav class="tabs" role="tablist" aria-label="Bo'limlar">
    <button class="tab" role="tab" data-act="tab" data-v="tables" id="tab-tables">Stollar</button>
    <button class="tab" role="tab" data-act="tab" data-v="products" id="tab-products">Mahsulotlar</button>
    <button class="tab" role="tab" data-act="tab" data-v="report" id="tab-report">Hisobot</button>
  </nav>

  <main id="view"></main>
</div>
<div id="modal"></div>

<script>
(function(){
  var KEY='biliyard160:v1', THEME_KEY='biliyard160:theme';
  var MONTHS=['yanvar','fevral','mart','aprel','may','iyun','iyul','avgust','sentabr','oktabr','noyabr','dekabr'];
  var WEEK=['yakshanba','dushanba','seshanba','chorshanba','payshanba','juma','shanba'];
  var BALLS={1:'b1',2:'b2',3:'b3'};
  var storageOk=true;

  function defaults(){
    return {
      rate:40000,
      products:[
        {id:'p1',name:'Suv 0.5 l',price:5000},
        {id:'p2',name:'Coca-Cola',price:10000},
        {id:'p3',name:'Choy',price:5000},
        {id:'p4',name:'Energetik',price:15000},
        {id:'p5',name:'Chips',price:8000}
      ],
      active:{1:null,2:null,3:null},
      history:[]
    };
  }
  function load(){
    var d=defaults();
    try{
      var raw=localStorage.getItem(KEY);
      if(raw){
        var o=JSON.parse(raw);
        if(o&&typeof o==='object'){
          if(typeof o.rate==='number'&&o.rate>0)d.rate=o.rate;
          if(Array.isArray(o.products))d.products=o.products;
          if(Array.isArray(o.history))d.history=o.history;
          if(o.active){[1,2,3].forEach(function(n){d.active[n]=o.active[n]||null;});}
        }
      }
      localStorage.setItem(KEY+':probe','1');localStorage.removeItem(KEY+':probe');
    }catch(e){storageOk=false;}
    return d;
  }
  var S=load();
  function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){storageOk=false;renderNotice();}}

  var view='tables', pendingStop=null, pendingDelP=null, pendingDelH=null, receipt=null;
  var timers={};

  /* ---------- helpers ---------- */
  function $(id){return document.getElementById(id);}
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function fmt(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,' ');}
  function pad(n){return n<10?'0'+n:''+n;}
  function hms(sec){var h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return [pad(h),pad(m),pad(s)];}
  function human(sec){
    var h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;
    if(h>0)return h+' soat '+m+' daq';
    if(m>0)return m+' daq '+s+' soniya';
    return s+' soniya';
  }
  function hm(ts){var d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes());}
  function dayKey(ts){var d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
  function monthKey(ts){var d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1);}
  function round100(n){return Math.round(n/100)*100;}
  function secs(a,now){return Math.max(0,Math.floor(((now||Date.now())-a.start)/1000));}
  function tableSum(sec,rate){return round100(sec*rate/3600);}
  function itemsSum(items){return (items||[]).reduce(function(t,i){return t+i.price*i.qty;},0);}
  function uid(){return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);}

  /* ---------- aggregates ---------- */
  function agg(list){
    var r={total:0,table:0,items:0,count:list.length,sec:0};
    list.forEach(function(s){r.total+=s.total;r.table+=s.tableSum;r.items+=s.itemsSum;r.sec+=s.sec;});
    return r;
  }
  function sessionsToday(){var k=dayKey(Date.now());return S.history.filter(function(s){return dayKey(s.end)===k;});}
  function sessionsMonth(){var k=monthKey(Date.now());return S.history.filter(function(s){return monthKey(s.end)===k;});}

  /* ---------- render: header bits ---------- */
  function renderDate(){
    var d=new Date();
    $('dateline').textContent=d.getDate()+'-'+MONTHS[d.getMonth()]+' '+d.getFullYear()+', '+WEEK[d.getDay()]+' · 1 soat = '+fmt(S.rate)+' so‘m';
    $('clock').textContent=pad(d.getHours())+':'+pad(d.getMinutes());
  }
  function renderNotice(){
    $('notice').innerHTML=storageOk?'':'<div class="notice">Brauzer xotirasi ishlamayapti. Sahifa yopilsa, hisob-kitoblar saqlanmaydi.</div>';
  }
  function renderTotals(){
    var t=agg(sessionsToday()), m=agg(sessionsMonth());
    var d=new Date();
    $('totals').innerHTML=
      '<div class="tot main"><span>Bugungi tushum</span><b class="num">'+fmt(t.total)+'<em>so‘m</em></b></div>'+
      '<div class="tot"><span>'+MONTHS[d.getMonth()]+' oyi tushumi</span><b class="num">'+fmt(m.total)+'<em>so‘m</em></b></div>'+
      '<div class="tot"><span>Bugun o‘yinlar</span><b class="num">'+t.count+'<em>ta, '+human(t.sec).replace(/ soniya$/,'')+'</em></b></div>';
  }
  function renderTabs(){
    ['tables','products','report'].forEach(function(v){
      var b=$('tab-'+v);b.setAttribute('aria-selected',v===view?'true':'false');
    });
  }

  /* ---------- render: tables ---------- */
  function timerHTML(sec){var p=hms(sec);return p[0]+'<span class="sep">:</span>'+p[1]+'<span class="sep">:</span>'+p[2];}

  function tableCard(n){
    var a=S.active[n], on=!!a, sec=on?secs(a):0, rate=on?a.rate:S.rate;
    var ts=tableSum(sec,rate), is=on?itemsSum(a.items):0;
    var h='<article class="card '+(on?'on':'idle')+'" data-table="'+n+'">';
    h+='<div class="chead"><div class="ball '+BALLS[n]+'" aria-hidden="true"><i>'+n+'</i></div><h2>'+n+'-stol</h2><span class="pill">'+(on?'O‘yinda':'Bo‘sh')+'</span></div>';
    h+='<div class="clockface"><div class="timer num" id="tm-'+n+'">'+timerHTML(sec)+'</div>';
    h+='<div class="sumline"><span class="lbl">Stol hisobi</span><span class="bigsum num"><span id="ts-'+n+'">'+fmt(ts)+'</span><em>so‘m</em></span></div></div>';
    if(on){
      h+='<div class="mini"><span>Boshlandi</span><b class="num">'+hm(a.start)+'</b></div>';
    }
    // products
    h+='<div class="psec"><h3>Mahsulotlar</h3>';
    if(S.products.length){
      h+='<div class="chips">';
      S.products.forEach(function(p){
        h+='<button type="button" class="chip" data-act="add" data-t="'+n+'" data-p="'+esc(p.id)+'" '+(on?'':'disabled')+'>'+esc(p.name)+' <small class="num">'+fmt(p.price)+'</small></button>';
      });
      h+='</div>';
    }else{
      h+='<p class="hint">Mahsulotlar bo‘limida mahsulot qo‘shing.</p>';
    }
    if(!on)h+='<p class="hint">O‘yin boshlangach mahsulot qo‘shish mumkin.</p>';
    if(on&&a.items.length){
      h+='<div class="lines">';
      a.items.forEach(function(i){
        h+='<div class="line"><span class="nm">'+esc(i.name)+'</span>'+
          '<span class="qty"><button type="button" data-act="dec" data-t="'+n+'" data-p="'+esc(i.pid)+'" aria-label="Kamaytirish">−</button><span class="num">'+i.qty+'</span><button type="button" data-act="inc" data-t="'+n+'" data-p="'+esc(i.pid)+'" aria-label="Ko‘paytirish">+</button></span>'+
          '<b class="num">'+fmt(i.price*i.qty)+'</b></div>';
      });
      h+='</div>';
    }
    h+='</div>';
    if(on){
      h+='<div class="mini"><span>Mahsulotlar</span><b class="num" id="ti-'+n+'">'+fmt(is)+'</b></div>';
      h+='<div class="total"><span class="lbl">Jami</span><b class="num" id="tt-'+n+'">'+fmt(ts+is)+' <small style="font:600 13px var(--f-body);color:var(--muted)">so‘m</small></b></div>';
      h+='<button type="button" class="btn stop '+(pendingStop===n?'sure':'')+'" data-act="stop" data-t="'+n+'">'+(pendingStop===n?'Tasdiqlang: o‘yinni tugatish':'O‘yinni to‘xtatish')+'</button>';
    }else{
      h+='<button type="button" class="btn start" data-act="start" data-t="'+n+'">O‘yinni boshlash</button>';
    }
    h+='</article>';
    return h;
  }
  function renderTables(){
    return '<div class="tables">'+tableCard(1)+tableCard(2)+tableCard(3)+'</div>';
  }

  /* ---------- render: products ---------- */
  function renderProducts(){
    var h='<div class="grid2">';
    h+='<div class="panel"><h2>Soatlik narx</h2><p>Hamma stollar uchun bir xil. Yangi narx keyingi boshlangan o‘yinlarga qo‘llanadi.</p>'+
       '<div class="field"><label for="rate">1 soat uchun (so‘m)</label><input type="number" id="rate" inputmode="numeric" min="1000" step="1000" value="'+S.rate+'"></div></div>';
    h+='<div class="panel"><h2>Yangi mahsulot</h2><p>Suv, ichimlik, yeguliklar va boshqalar.</p>'+
       '<form class="formrow" id="addform" autocomplete="off">'+
       '<div class="field"><label for="pname">Nomi</label><input type="text" id="pname" placeholder="Masalan: Fanta" maxlength="40" required></div>'+
       '<div class="field"><label for="pprice">Narxi (so‘m)</label><input type="number" id="pprice" inputmode="numeric" min="0" step="500" placeholder="8000" required></div>'+
       '<button class="btn start" type="submit">Qo‘shish</button></form></div>';
    h+='</div>';
    h+='<div class="panel" style="margin-top:16px"><h2>Mahsulotlar ro‘yxati</h2><p>Boshlang‘ich narxlar namuna. O‘zingizning narxlaringizga o‘zgartiring.</p><div class="plist">';
    if(!S.products.length)h+='<div class="empty">Hozircha mahsulot yo‘q.</div>';
    S.products.forEach(function(p){
      h+='<div class="prow"><span class="nm">'+esc(p.name)+'</span>'+
         '<span class="price"><input type="number" class="pedit" data-p="'+esc(p.id)+'" id="pe-'+esc(p.id)+'" inputmode="numeric" min="0" step="500" value="'+p.price+'" aria-label="'+esc(p.name)+' narxi"></span>'+
         '<button type="button" class="linkbtn '+(pendingDelP===p.id?'sure':'')+'" data-act="delp" data-p="'+esc(p.id)+'">'+(pendingDelP===p.id?'Aniq o‘chirilsinmi?':'O‘chirish')+'</button></div>';
    });
    h+='</div></div>';
    return h;
  }

  /* ---------- render: report ---------- */
  function statsBlock(a){
    return '<div class="stats">'+
      '<div class="stat big"><span>Jami tushum</span><b class="num">'+fmt(a.total)+' so‘m</b></div>'+
      '<div class="stat"><span>Stol vaqti</span><b class="num">'+fmt(a.table)+'</b></div>'+
      '<div class="stat"><span>Mahsulotlar</span><b class="num">'+fmt(a.items)+'</b></div>'+
      '<div class="stat"><span>O‘yinlar soni</span><b class="num">'+a.count+' ta</b></div>'+
      '<div class="stat"><span>O‘ynalgan vaqt</span><b class="num">'+human(a.sec).replace(/ soniya$/,'')+'</b></div></div>';
  }
  function perTable(list){
    var h='<div class="rows">';
    [1,2,3].forEach(function(n){
      var sub=list.filter(function(s){return s.table===n;}), a=agg(sub);
      h+='<div class="rrow"><div class="ball '+BALLS[n]+'"><i>'+n+'</i></div><div>'+n+'-stol<small>'+a.count+' ta o‘yin, '+human(a.sec).replace(/ soniya$/,'')+'</small></div><b class="num">'+fmt(a.total)+'</b></div>';
    });
    return h+'</div>';
  }
  function renderReport(){
    var today=sessionsToday(), month=sessionsMonth(), now=new Date();
    var h='<div class="rgrid">';
    h+='<div class="panel"><h2>Bugun, '+now.getDate()+'-'+MONTHS[now.getMonth()]+'</h2>'+statsBlock(agg(today))+perTable(today)+'</div>';
    h+='<div class="panel"><h2>'+MONTHS[now.getMonth()].charAt(0).toUpperCase()+MONTHS[now.getMonth()].slice(1)+' oyi</h2>'+statsBlock(agg(month))+perTable(month)+'</div>';
    h+='</div>';

    // daily bars for month
    var dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate(), byDay={}, max=0;
    month.forEach(function(s){var d=new Date(s.end).getDate();byDay[d]=(byDay[d]||0)+s.total;});
    for(var d=1;d<=dim;d++){if((byDay[d]||0)>max)max=byDay[d];}
    h+='<div class="panel" style="margin-top:16px"><h2>Oy bo‘yicha kunlik tushum</h2>';
    if(!month.length){
      h+='<div class="empty">Bu oyda hali yakunlangan o‘yin yo‘q. Birinchi o‘yin tugagach grafik shu yerda paydo bo‘ladi.</div>';
    }else{
      h+='<div class="bars" role="img" aria-label="Oydagi kunlik tushum grafigi">';
      for(var i=1;i<=dim;i++){
        var v=byDay[i]||0, pct=max?Math.max(v?6:0,Math.round(v/max*100)):0;
        h+='<div class="bar '+(v?'has ':'')+(i===now.getDate()?'today':'')+'" style="height:'+(v?pct:2)+'%;animation-delay:'+(i*12)+'ms" title="'+i+'-'+MONTHS[now.getMonth()]+': '+fmt(v)+' so‘m"></div>';
      }
      h+='</div><div class="baxis num"><span>1</span><span>'+Math.ceil(dim/2)+'</span><span>'+dim+'</span></div>';
      var days=Object.keys(byDay).map(Number).sort(function(a,b){return b-a;});
      h+='<div class="rows">';
      days.forEach(function(dn){
        var cnt=month.filter(function(s){return new Date(s.end).getDate()===dn;}).length;
        h+='<div class="rrow" style="grid-template-columns:1fr auto"><div>'+dn+'-'+MONTHS[now.getMonth()]+'<small>'+cnt+' ta o‘yin</small></div><b class="num">'+fmt(byDay[dn])+'</b></div>';
      });
      h+='</div>';
    }
    h+='</div>';

    // today's sessions
    h+='<div class="panel" style="margin-top:16px"><h2>Bugungi o‘yinlar</h2>';
    if(!today.length){
      h+='<div class="empty">Bugun hali o‘yin tugamagan.</div>';
    }else{
      h+='<div class="rows">';
      today.slice().sort(function(a,b){return b.end-a.end;}).forEach(function(s){
        var it=s.items&&s.items.length?' · '+s.items.map(function(i){return esc(i.name)+' ×'+i.qty;}).join(', '):'';
        h+='<div class="rrow" style="grid-template-columns:auto 1fr auto auto"><div class="ball '+BALLS[s.table]+'"><i>'+s.table+'</i></div>'+
           '<div>'+hm(s.start)+' – '+hm(s.end)+' · '+human(s.sec)+'<small>Stol '+fmt(s.tableSum)+(s.itemsSum?' + mahsulot '+fmt(s.itemsSum):'')+it+'</small></div>'+
           '<b class="num">'+fmt(s.total)+'</b>'+
           '<button type="button" class="linkbtn '+(pendingDelH===s.id?'sure':'')+'" data-act="delh" data-h="'+esc(s.id)+'">'+(pendingDelH===s.id?'Aniq?':'O‘chirish')+'</button></div>';
      });
      h+='</div>';
    }
    h+='</div>';
    return h;
  }

  /* ---------- render: receipt ---------- */
  function renderModal(){
    var m=$('modal');
    if(!receipt){m.innerHTML='';return;}
    var s=receipt, h='<div class="overlay" data-act="closeR"><div class="receipt" role="dialog" aria-modal="true" aria-labelledby="rt">';
    h+='<h2 id="rt">'+s.table+'-stol hisobi</h2>';
    h+='<div class="k"><span>Vaqt</span><b class="num">'+hm(s.start)+' – '+hm(s.end)+'</b></div>';
    h+='<div class="k"><span>O‘ynalgan</span><b>'+human(s.sec)+'</b></div>';
    h+='<div class="k"><span>Stol summasi</span><b class="num">'+fmt(s.tableSum)+' so‘m</b></div>';
    if(s.items.length){
      h+='<hr>';
      s.items.forEach(function(i){h+='<div class="k"><span>'+esc(i.name)+' × '+i.qty+'</span><b class="num">'+fmt(i.price*i.qty)+'</b></div>';});
      h+='<div class="k"><span>Mahsulotlar</span><b class="num">'+fmt(s.itemsSum)+' so‘m</b></div>';
    }
    h+='<hr><div class="k"><span>To‘lov</span><b class="gt num">'+fmt(s.total)+' so‘m</b></div>';
    h+='<button type="button" class="btn start" data-act="closeR" id="closeR">Yopish</button></div></div>';
    m.innerHTML=h;
    var b=$('closeR');if(b)b.focus();
  }

  /* ---------- master render ---------- */
  function render(){
    renderDate();renderTotals();renderTabs();renderNotice();
    var v=$('view'), html=view==='tables'?renderTables():view==='products'?renderProducts():renderReport();
    v.innerHTML='<div class="view">'+html+'</div>';
    renderModal();
  }
  function tick(){
    renderDate();
    [1,2,3].forEach(function(n){
      var a=S.active[n];if(!a)return;
      var sec=secs(a), ts=tableSum(sec,a.rate), is=itemsSum(a.items);
      var tm=$('tm-'+n);if(tm)tm.innerHTML=timerHTML(sec);
      var e=$('ts-'+n);if(e)e.textContent=fmt(ts);
      var t=$('tt-'+n);if(t)t.firstChild.nodeValue=fmt(ts+is)+' ';
    });
  }

  /* ---------- actions ---------- */
  function startTable(n){
    S.active[n]={start:Date.now(),rate:S.rate,items:[]};pendingStop=null;save();render();
  }
  function stopTable(n){
    var a=S.active[n];if(!a)return;
    var end=Date.now(), sec=Math.floor((end-a.start)/1000);
    var ts=tableSum(sec,a.rate), is=itemsSum(a.items);
    var s={id:'h'+end.toString(36)+n,table:n,start:a.start,end:end,sec:sec,rate:a.rate,tableSum:ts,items:a.items.slice(),itemsSum:is,total:ts+is};
    S.history.push(s);S.active[n]=null;pendingStop=null;receipt=s;save();render();
  }
  function addItem(n,pid,delta){
    var a=S.active[n];if(!a)return;
    var it=a.items.filter(function(i){return i.pid===pid;})[0];
    if(!it){
      var p=S.products.filter(function(x){return x.id===pid;})[0];if(!p||delta<0)return;
      it={pid:pid,name:p.name,price:p.price,qty:0};a.items.push(it);
    }
    it.qty+=delta;
    if(it.qty<=0)a.items=a.items.filter(function(i){return i!==it;});
    save();render();
  }
  function flash(key,id){
    if(key==='stop')pendingStop=id;
    if(key==='delp')pendingDelP=id;
    if(key==='delh')pendingDelH=id;
    render();
    clearTimeout(timers[key]);
    timers[key]=setTimeout(function(){
      if(key==='stop'&&pendingStop===id)pendingStop=null;
      if(key==='delp'&&pendingDelP===id)pendingDelP=null;
      if(key==='delh'&&pendingDelH===id)pendingDelH=null;
      render();
    },3500);
  }

  document.addEventListener('click',function(e){
    var el=e.target.closest('[data-act]');if(!el)return;
    var act=el.getAttribute('data-act'), t=+el.getAttribute('data-t'), p=el.getAttribute('data-p'), hh=el.getAttribute('data-h');
    if(act==='closeR'){
      if(el.classList.contains('overlay')&&e.target!==el)return;
      receipt=null;renderModal();return;
    }
    if(act==='tab'){view=el.getAttribute('data-v');pendingDelP=null;pendingDelH=null;render();return;}
    if(act==='start')return startTable(t);
    if(act==='stop'){if(pendingStop===t)return stopTable(t);return flash('stop',t);}
    if(act==='add'||act==='inc')return addItem(t,p,1);
    if(act==='dec')return addItem(t,p,-1);
    if(act==='delp'){
      if(pendingDelP===p){S.products=S.products.filter(function(x){return x.id!==p;});pendingDelP=null;save();render();return;}
      return flash('delp',p);
    }
    if(act==='delh'){
      if(pendingDelH===hh){S.history=S.history.filter(function(x){return x.id!==hh;});pendingDelH=null;save();render();return;}
      return flash('delh',hh);
    }
  });
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&receipt){receipt=null;renderModal();}});
  document.addEventListener('submit',function(e){
    if(e.target.id!=='addform')return;
    e.preventDefault();
    var name=$('pname').value.trim(), price=Math.round(Number($('pprice').value));
    if(!name||!(price>=0))return;
    S.products.push({id:uid(),name:name,price:price});save();render();
    var n=$('pname');if(n)n.focus();
  });
  document.addEventListener('change',function(e){
    var t=e.target;
    if(t.id==='rate'){
      var v=Math.round(Number(t.value));
      if(v>=1000){S.rate=v;save();renderDate();}else{t.value=S.rate;}
    }
    if(t.classList&&t.classList.contains('pedit')){
      var id=t.getAttribute('data-p'), pr=Math.round(Number(t.value));
      var p=S.products.filter(function(x){return x.id===id;})[0];
      if(p&&pr>=0){p.price=pr;save();}else if(p){t.value=p.price;}
    }
  });

  /* ---------- theme ---------- */
  function effectiveDark(){
    var a=document.documentElement.getAttribute('data-theme');
    if(a)return a==='dark';
    return window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
  }
  try{var st=localStorage.getItem(THEME_KEY);if(st==='dark'||st==='light')document.documentElement.setAttribute('data-theme',st);}catch(e){}
  $('themebtn').addEventListener('click',function(){
    var next=effectiveDark()?'light':'dark';
    document.documentElement.setAttribute('data-theme',next);
    try{localStorage.setItem(THEME_KEY,next);}catch(e){}
  });

  render();
  setInterval(tick,1000);
})();
</script>

</body>
</html>
